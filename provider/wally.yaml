provider: wally
label:
  en_US: Wally
description:
  en_US: Fast inference for open-weight models through an OpenAI-compatible API.
icon_small:
  en_US: icon.svg
icon_large:
  en_US: icon.svg
background: "#FFF1E6"
help:
  title:
    en_US: Get your API key from the RunAnywhere console
  url:
    en_US: https://console.runanywhere.ai
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your Wally API key (sk-runa-...)
model_credential_schema:
  model:
    label:
      en_US: Model ID
    placeholder:
      en_US: A model ID returned by GET https://inference.runanywhere.ai/v1/models
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your Wally API key (sk-runa-...)
    - variable: context_size
      label:
        en_US: Context size
      type: text-input
      required: true
      default: "1048576"
    - variable: max_tokens_to_sample
      label:
        en_US: Upper bound for max tokens
      type: text-input
      default: "131072"
    - variable: function_calling_type
      label:
        en_US: Tool calling
      type: select
      required: false
      default: tool_call
      options:
        - value: tool_call
          label:
            en_US: Supported
        - value: no_call
          label:
            en_US: Not supported
    - variable: vision_support
      label:
        en_US: Vision (image input)
      type: select
      required: false
      default: not_support
      options:
        - value: support
          label:
            en_US: Supported
        - value: not_support
          label:
            en_US: Not supported
models:
  llm:
    predefined:
      - models/llm/*.yaml
    position: models/llm/_position.yaml
extra:
  python:
    provider_source: provider/wally.py
    model_sources:
      - models/llm/llm.py
