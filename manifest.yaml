version: 0.0.3
type: plugin
author: runanywhereai
name: wally
label:
  en_US: Wally
description:
  en_US: Fast inference for open-weight models (GLM-5.3 Flash, DeepSeek V4.1 Flash, MiMo V2.6 Flash) through an OpenAI-compatible API, with tool calling and reasoning.
icon: icon.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
      text_embedding: false
      rerank: false
      tts: false
      speech2text: false
      moderation: false
plugins:
  models:
    - provider/wally.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.0.0
created_at: 2026-10-10T00:00:00Z
privacy: PRIVACY.md
repo: https://github.com/RunanywhereAI/wally-dify-plugin
contact: support@runanywhere.ai
network:
  domains:
    - inference.runanywhere.ai
verified: false
