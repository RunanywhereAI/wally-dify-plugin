model: deepseek-v4.1-flash
label:
  en_US: DeepSeek V4.1 Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 65536
  - name: reasoning_effort
    type: string
    required: false
    label:
      en_US: Reasoning effort
    help:
      en_US: How much the model thinks before it answers. none turns thinking off. Leave empty for the model default (high).
    options:
      - none
      - low
      - medium
      - high
      - max
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.30"
  output: "1.20"
  unit: "0.000001"
  currency: USD
