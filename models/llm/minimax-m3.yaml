model: minimax-m3
label:
  en_US: MiniMax M3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 524287
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 8192
    min: 1
    max: 131072
  - name: reasoning_effort
    type: string
    required: false
    label:
      en_US: Reasoning effort
    help:
      en_US: How much the model thinks before it answers. Thinking can't be turned off; low is the least. Leave empty for the model default.
    options:
      - low
      - medium
      - high
      - xhigh
      - max
  - name: response_format
    use_template: response_format
    options:
      - text
      - json_object
      - json_schema
  - name: json_schema
    use_template: json_schema
pricing:
  input: "0.33"
  output: "1.32"
  unit: "0.000001"
  currency: USD
